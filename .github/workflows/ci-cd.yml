name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    # Home page queries Prisma at build time; keep credentials in sync with docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: niva
          POSTGRES_PASSWORD: niva
          POSTGRES_DB: niva_cart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niva -d niva_cart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://niva:niva@localhost:5432/niva_cart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Prisma env file
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.production

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed catalog
        run: npm run db:seed

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://niva:niva@localhost:5432/niva_cart

      - name: Start production server
        run: |
          npm start &
          echo "Waiting for server to start..."
          sleep 20
          echo "Checking if server is ready..."
          curl -f http://localhost:3000 || exit 1
          echo "Server is ready!"
        env:
          DATABASE_URL: postgresql://niva:niva@localhost:5432/niva_cart

      - name: Run Lighthouse performance check
        run: |
          echo "Running Lighthouse audit..."
          npm run lighthouse:ci
          echo "Checking performance scores..."
          npm run lighthouse:check
        env:
          CI: true

  deploy:
    needs: [test, lighthouse]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel deploy --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --confirm
