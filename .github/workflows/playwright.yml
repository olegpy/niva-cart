name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep in sync with @playwright/test in package.json when upgrading Playwright.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-noble

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Favourites e2e calls Prisma; keep credentials in sync with docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: niva
          POSTGRES_PASSWORD: niva
          POSTGRES_DB: niva_cart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niva -d niva_cart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://niva:niva@localhost:5432/niva_cart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Playwright Docker image
        uses: actions/cache@v4
        with:
          path: playwright-image.tar
          key: playwright-docker-v1.59.1-noble

      - name: Load or pull Playwright Docker image
        run: |
          if [ -f playwright-image.tar ]; then
            echo "Loading Playwright image from cache..."
            docker load -i playwright-image.tar
          else
            echo "Pulling Playwright image (first run — will cache for next time)..."
            docker pull "$PLAYWRIGHT_IMAGE"
            docker save "$PLAYWRIGHT_IMAGE" -o playwright-image.tar
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run Playwright tests
        run: |
          docker run --rm --init --ipc=host \
            --add-host=host.docker.internal:host-gateway \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CI=true \
            -e DATABASE_URL=postgresql://niva:niva@host.docker.internal:5432/niva_cart \
            "$PLAYWRIGHT_IMAGE" \
            npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
